<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayBeat Admin Login</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #071224;
      background-image: url('bg.png');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f4f7ff;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(245, 166, 35, 0.12), transparent 28%), radial-gradient(circle at 80% 10%, rgba(155, 89, 182, 0.14), transparent 30%);
      pointer-events: none;
      z-index: 1;
    }

    .login-shell {
      width: min(420px, calc(100% - 32px));
      background: rgba(7, 18, 36, 0.96);
      border: 1px solid rgba(245, 166, 35, 0.18);
      border-radius: 26px;
      padding: 36px 32px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 2;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo-mark {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: linear-gradient(135deg, #f5a623, #e08800);
      display: grid;
      place-items: center;
      box-shadow: 0 22px 40px rgba(245, 166, 35, 0.28);
      overflow: hidden;
    }

    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }

    .logo-mark span {
      color: #071224;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .brand h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: -0.04em;
      font-weight: 900;
    }

    .brand h1 strong {
      color: #f5a623;
    }

    .brand p {
      margin: 10px 0 0;
      color: #7a9ac8;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: #7a9ac8;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      border: 1px solid rgba(245, 166, 35, 0.22);
      border-radius: 14px;
      padding: 14px 16px;
      background: rgba(8, 20, 44, 0.95);
      color: #f4f7ff;
      font-size: 15px;
    }

    .field input:focus {
      outline: none;
      border-color: #f5a623;
      box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.12);
    }

    .login-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px 18px;
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #f5a623, #e08800);
      color: #071224;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(245, 166, 35, 0.25);
    }

    .hint {
      margin: 18px 0 0;
      color: #8da2cf;
      font-size: 13px;
      text-align: center;
    }

    .error {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(231, 76, 60, 0.14);
      color: #ffb3b3;
      display: none;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="login-shell">
    <div class="logo-wrap">
      <div class="logo-mark"><img src="logo.png" alt="PlayBeat Logo"
          onerror="this.parentElement.innerHTML='<span>▶</span>'"></div>
    </div>
    <div class="brand">
      <h1>play<strong>beat</strong></h1>
      <p>Admin login portal</p>
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn">Login</button>
    <div class="error" id="errorMsg">Invalid username or password.</div>
    <p class="hint">Use <strong>admin</strong> / <strong>playbeat123</strong></p>
  </div>
  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000/api' : '/api';
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    async function adminLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const email = username.toLowerCase() === 'admin' ? 'admin@playbeat.digital' : username;
      if (!password) {
        errorMsg.textContent = 'Password is required.';
        errorMsg.style.display = 'block';
        return;
      }
      try {
        const response = await fetch(API_BASE + '/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || 'Login failed');
        }
        await response.json();
        localStorage.setItem('pb_admin_auth', 'true');
        window.location.href = 'admin (1).html';
      } catch (err) {
        errorMsg.textContent = err.message || 'Invalid username or password.';
        errorMsg.style.display = 'block';
      }
    }

    loginBtn.addEventListener('click', adminLogin);
    document.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        adminLogin();
      }
    });
  </script>

  <script type="text/javascript"

</body>

</html>
